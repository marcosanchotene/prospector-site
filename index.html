<title>Prospector</title>
<style>
:root{--bg:#f6f5f1;--ink:#1d1d1b;--muted:#6b6a64;--line:#e4e2da;--surface:#fff;--accent:#1f5f4a}
@media (prefers-color-scheme:dark){:root{--bg:#15161a;--ink:#ecebe6;--muted:#9a998f;--line:#2e3036;--surface:#1e2025;--accent:#6fc2a0}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;width:min(320px,calc(100vw - 32px))}
h1{font-size:18px;margin:0 0 14px}
input[type=password]{width:100%;box-sizing:border-box;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button{margin-top:12px;width:100%;font:inherit;font-weight:600;padding:9px;border:0;border-radius:8px;background:var(--accent);color:var(--bg);cursor:pointer}
label{display:flex;gap:6px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
#err{color:#b4410f;font-size:13px;margin:8px 0 0;min-height:1em}
</style>
</head>

</form>

const KEY="prospector-pw";
const b64=(s)=>Uint8Array.from(atob(s),(c)=>c.charCodeAt(0));
async function open(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(PAYLOAD));
  const html=new TextDecoder().decode(plain);
  document.open();document.write(html);document.close();
}
const get=()=>{try{return localStorage.getItem(KEY)}catch{return null}};
const set=(v)=>{try{v==null?localStorage.removeItem(KEY):localStorage.setItem(KEY,v)}catch{}};
const err=document.getElementById("err");
async function tryOpen(pw,remember){
  err.textContent="";
  try{await open(pw);if(remember)set(pw)}
  catch{set(null);err.textContent="Senha incorreta."}
}
document.getElementById("f").addEventListener("submit",(e)=>{e.preventDefault();tryOpen(document.getElementById("pw").value,document.getElementById("rem").checked)});
if(!window.crypto||!crypto.subtle){err.textContent="Abra por HTTPS para decifrar."}
else{const saved=get();if(saved)tryOpen(saved,true)}
</script>
